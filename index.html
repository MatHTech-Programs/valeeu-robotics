<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vale Robotics 2026 | Certificado Oficial</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-dark: #05101f;
        --card-bg: #09172c;
        --orange: #ff6b00;
        --orange-light: #ff8533;
        --yellow: #fca311;
        --cyan: #00d2ff;
        --white: #ffffff;
        --text-dim: #94a3b8;
        --border-blue: #1e3a5f;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--white);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem 1rem;
        background-image:
          radial-gradient(
            circle at 85% 15%,
            rgba(255, 107, 0, 0.15) 0%,
            transparent 45%
          ),
          radial-gradient(
            circle at 15% 85%,
            rgba(0, 210, 255, 0.12) 0%,
            transparent 40%
          ),
          linear-gradient(rgba(5, 16, 31, 0.94), rgba(5, 16, 31, 0.94)),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 39px,
            rgba(30, 58, 95, 0.25) 40px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 39px,
            rgba(30, 58, 95, 0.25) 40px
          );
      }

      .card {
        width: 100%;
        max-width: 460px;
        background: var(--card-bg);
        border: 2px solid var(--border-blue);
        border-radius: 14px;
        padding: 2.2rem 2rem;
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.7),
          0 0 25px rgba(255, 107, 0, 0.2);
        position: relative;
      }

      .card::before {
        content: "";
        position: absolute;
        top: -2px;
        left: 15%;
        right: 15%;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--orange),
          var(--yellow),
          transparent
        );
      }

      .brand {
        text-align: center;
        margin-bottom: 1.8rem;
      }

      .tag-ufsc {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(252, 163, 17, 0.12);
        border: 1px solid var(--yellow);
        color: var(--yellow);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 4px;
        margin-bottom: 0.8rem;
      }

      .title-main {
        font-family: "Chakra Petch", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 1px;
        line-height: 1.1;
        color: var(--white);
        text-transform: uppercase;
      }

      .title-main span {
        color: var(--orange);
      }

      .event-desc {
        font-size: 0.82rem;
        color: var(--text-dim);
        font-weight: 600;
        letter-spacing: 0.8px;
        margin-top: 0.4rem;
        text-transform: uppercase;
      }

      .event-info-strip {
        background: #0f2341;
        border: 1px dashed #244b7a;
        border-radius: 6px;
        padding: 0.6rem 0.8rem;
        font-size: 0.75rem;
        color: #cbd5e1;
        text-align: center;
        margin-bottom: 1.5rem;
        line-height: 1.4;
      }

      .form-group {
        margin-bottom: 1.1rem;
      }

      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.6px;
        margin-bottom: 0.4rem;
        color: #cbd5e1;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        padding: 0.85rem 1rem;
        background: #061120;
        border: 1px solid var(--border-blue);
        border-radius: 6px;
        color: var(--white);
        font-size: 0.95rem;
        font-family: inherit;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input:focus {
        outline: none;
        border-color: var(--orange);
        box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.25);
        background: #0a172a;
      }

      input::placeholder {
        color: #475569;
      }

      .btn-emit {
        width: 100%;
        padding: 1rem;
        margin-top: 0.8rem;
        background: linear-gradient(135deg, var(--orange) 0%, #e05300 100%);
        border: none;
        border-radius: 6px;
        color: var(--white);
        font-family: "Chakra Petch", sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }

      .btn-emit:hover:not(:disabled) {
        background: linear-gradient(
          135deg,
          var(--orange-light) 0%,
          var(--orange) 100%
        );
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 107, 0, 0.5);
      }

      .btn-emit:disabled {
        background: #334155;
        color: #94a3b8;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #ffffff;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .sponsors {
        margin-top: 1.8rem;
        padding-top: 1.2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
      }

      .sponsors-label {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: #64748b;
        text-transform: uppercase;
        margin-bottom: 0.75rem;
      }

      .sponsors-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 14px;
        font-size: 0.75rem;
        font-weight: 700;
        color: #94a3b8;
        letter-spacing: 0.5px;
      }

      .sponsors-list span {
        color: var(--yellow);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="tag-ufsc">UFSC Blumenau • Desafio Final</div>
        <h1 class="title-main">VALEEU <span>ROBOTICS</span> 2026</h1>
        <p class="event-desc">Emissão de Certificado</p>
      </div>

      <div class="event-info-strip">
        Evento Oficial: 06 de Novembro de 2026<br />
        Local: Quadra da UFSC Blumenau • 4h Complementares
      </div>

      <form id="certForm">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input
            type="text"
            id="nome"
            placeholder="Digite seu nome completo"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input
            type="text"
            id="cpf"
            placeholder="000.000.000-00"
            maxlength="14"
            required
            inputmode="numeric"
          />
        </div>

        <div class="form-group">
          <label for="matricula">Matrícula UFSC</label>
          <input
            type="text"
            id="matricula"
            placeholder="Digite sua matrícula acadêmica"
            required
            inputmode="numeric"
          />
        </div>

        <button type="submit" id="btnSubmit" class="btn-emit">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Gerar Certificado Oficial</span>
        </button>
      </form>

      <div class="sponsors">
        <div class="sponsors-label">Empresas e Parcerias</div>
        <div class="sponsors-list">
          <div>WEG</div>
          <span>•</span>
          <div>BOSCH REXROTH</div>
          <span>•</span>
          <div>SELGRON</div>
          <span>•</span>
          <div>NEXT</div>
          <span>•</span>
          <div>PROVOLT</div>
          <span>•</span>
          <div>GELÁSIO</div>
        </div>
      </div>
    </div>

    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbx8wqUT2gKVvq-tT70Fasq6CzLfYzP8YivOAN9gxXIdKWjaT1gBbf4gZSE6XsxmyaO5/exec";

      const cpfInput = document.getElementById("cpf");
      cpfInput.addEventListener("input", (e) => {
        let val = e.target.value.replace(/\D/g, "");
        if (val.length > 11) val = val.slice(0, 11);
        val = val.replace(/(\d{3})(\d)/, "$1.$2");
        val = val.replace(/(\d{3})(\d)/, "$1.$2");
        val = val.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        e.target.value = val;
      });

      document
        .getElementById("certForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const btn = document.getElementById("btnSubmit");
          const btnText = document.getElementById("btnText");
          const spinner = document.getElementById("btnSpinner");

          btn.disabled = true;
          spinner.style.display = "inline-block";
          btnText.innerText = "Processando...";

          const dados = {
            nome: document.getElementById("nome").value.trim(),
            cpf: document.getElementById("cpf").value.trim(),
            matricula: document.getElementById("matricula").value.trim(),
          };

          try {
            fetch(SCRIPT_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify(dados),
            }).catch(() => {});

            const pdfDoc = await PDFLib.PDFDocument.create();
            const page = pdfDoc.addPage([841.89, 595.28]);
            const { width, height } = page.getSize();

            const fontBold = await pdfDoc.embedFont(
              PDFLib.StandardFonts.HelveticaBold,
            );
            const fontRegular = await pdfDoc.embedFont(
              PDFLib.StandardFonts.Helvetica,
            );
            const fontItalic = await pdfDoc.embedFont(
              PDFLib.StandardFonts.HelveticaOblique,
            );

            const cNavyDark = PDFLib.rgb(0.03, 0.08, 0.16);
            const cNavyMid = PDFLib.rgb(0.07, 0.15, 0.27);
            const cOrange = PDFLib.rgb(1.0, 0.42, 0.0);
            const cYellow = PDFLib.rgb(0.99, 0.64, 0.07);
            const cPaper = PDFLib.rgb(0.97, 0.98, 0.99);
            const cTextDark = PDFLib.rgb(0.08, 0.11, 0.16);
            const cTextMuted = PDFLib.rgb(0.42, 0.48, 0.55);

            page.drawRectangle({
              x: 0,
              y: 0,
              width: width,
              height: height,
              color: cNavyDark,
            });

            page.drawRectangle({
              x: 18,
              y: 18,
              width: width - 36,
              height: height - 36,
              color: cPaper,
            });

            page.drawRectangle({
              x: 28,
              y: 28,
              width: width - 56,
              height: height - 56,
              borderColor: cNavyMid,
              borderWidth: 2,
            });

            page.drawRectangle({
              x: 32,
              y: 32,
              width: width - 64,
              height: height - 64,
              borderColor: cOrange,
              borderWidth: 1,
            });

            const cornerSize = 24;
            const corners = [
              { x: 28, y: 28, dx: 1, dy: 1 },
              { x: width - 28, y: 28, dx: -1, dy: 1 },
              { x: 28, y: height - 28, dx: 1, dy: -1 },
              { x: width - 28, y: height - 28, dx: -1, dy: -1 },
            ];

            corners.forEach((c) => {
              page.drawSquare({
                x: c.dx === 1 ? c.x : c.x - 10,
                y: c.dy === 1 ? c.y : c.y - 10,
                size: 10,
                color: cYellow,
              });
              page.drawLine({
                start: { x: c.x, y: c.y },
                end: { x: c.x + c.dx * cornerSize, y: c.y },
                thickness: 3.5,
                color: cOrange,
              });
              page.drawLine({
                start: { x: c.x, y: c.y },
                end: { x: c.x, y: c.y + c.dy * cornerSize },
                thickness: 3.5,
                color: cOrange,
              });
            });

            page.drawRectangle({
              x: 33,
              y: height - 44,
              width: width - 66,
              height: 11,
              color: cNavyMid,
            });

            page.drawRectangle({
              x: 33,
              y: height - 48,
              width: width - 66,
              height: 4,
              color: cOrange,
            });

            const drawCentered = (text, y, size, font, color) => {
              const tw = font.widthOfTextAtSize(text, size);
              page.drawText(text, {
                x: (width - tw) / 2,
                y: y,
                size: size,
                font: font,
                color: color,
              });
            };

            drawCentered(
              "UNIVERSIDADE FEDERAL DE SANTA CATARINA — UFSC BLUMENAU",
              518,
              11,
              fontBold,
              cNavyDark,
            );
            drawCentered(
              "VALEEU ROBOTIC • DESAFIO 2026",
              503,
              9.5,
              fontBold,
              cOrange,
            );

            drawCentered(
              "CERTIFICADO DE PARTICIPAÇÃO",
              446,
              27,
              fontBold,
              cNavyDark,
            );

            const eventBarWidth = 420;
            page.drawRectangle({
              x: (width - eventBarWidth) / 2,
              y: 418,
              width: eventBarWidth,
              height: 20,
              color: cNavyDark,
            });
            drawCentered("VALEEU ROBOTICS 2026", 423, 11.5, fontBold, cYellow);

            drawCentered(
              "Certificamos para os devidos fins legais e acadêmicos que",
              374,
              12.5,
              fontItalic,
              cTextMuted,
            );

            const nome = dados.nome.toUpperCase();
            drawCentered(nome, 332, 22, fontBold, cNavyDark);

            const nomeW = fontBold.widthOfTextAtSize(nome, 22);
            const lineW = Math.max(nomeW + 50, 360);
            page.drawLine({
              start: { x: (width - lineW) / 2, y: 323 },
              end: { x: (width + lineW) / 2, y: 323 },
              thickness: 1.5,
              color: cOrange,
            });

            const l1 = `portador(a) do CPF nº ${dados.cpf} e Matrícula Acadêmica nº ${dados.matricula},`;
            const l2 =
              "participou com êxito das bancas avaliativas e atividades da Grande Final do Desafio";
            const l3 =
              "Valeeu Robotics 2026, realizado nas dependências da Quadra da UFSC Blumenau em 06 de novembro de 2026.";

            drawCentered(l1, 288, 11.5, fontRegular, cTextDark);
            drawCentered(l2, 270, 11.5, fontRegular, cTextDark);
            drawCentered(l3, 252, 11.5, fontRegular, cTextDark);

            const badgeW = 260;
            page.drawRectangle({
              x: (width - badgeW) / 2,
              y: 208,
              width: badgeW,
              height: 24,
              color: PDFLib.rgb(0.92, 0.94, 0.97),
              borderColor: cYellow,
              borderWidth: 1,
            });
            drawCentered(
              "CARGA HORÁRIA CERTIFICADA: 4 HORAS",
              215,
              9.5,
              fontBold,
              cNavyDark,
            );

            const sigY = 126;
            const colLeft = 220;
            const colRight = width - 220;

            page.drawLine({
              start: { x: colLeft - 105, y: sigY },
              end: { x: colLeft + 105, y: sigY },
              thickness: 1,
              color: cTextMuted,
            });
            const ass1 = "Comissão Organizadora";
            const sub1 = "Valeeu Robotics — UFSC Blumenau";
            page.drawText(ass1, {
              x: colLeft - fontBold.widthOfTextAtSize(ass1, 9.5) / 2,
              y: sigY - 14,
              size: 9.5,
              font: fontBold,
              color: cTextDark,
            });
            page.drawText(sub1, {
              x: colLeft - fontRegular.widthOfTextAtSize(sub1, 8) / 2,
              y: sigY - 26,
              size: 8,
              font: fontRegular,
              color: cTextMuted,
            });

            page.drawLine({
              start: { x: colRight - 105, y: sigY },
              end: { x: colRight + 105, y: sigY },
              thickness: 1,
              color: cTextMuted,
            });
            const ass2 = "Coordenação Técnica do Evento";
            const sub2 = "Valeeu Robotics 2026";
            page.drawText(ass2, {
              x: colRight - fontBold.widthOfTextAtSize(ass2, 9.5) / 2,
              y: sigY - 14,
              size: 9.5,
              font: fontBold,
              color: cTextDark,
            });
            page.drawText(sub2, {
              x: colRight - fontRegular.widthOfTextAtSize(sub2, 8) / 2,
              y: sigY - 26,
              size: 8,
              font: fontRegular,
              color: cTextMuted,
            });

            page.drawRectangle({
              x: 33,
              y: 33,
              width: width - 66,
              height: 38,
              color: cNavyDark,
            });

            const empText =
              "EMPRESAS PARTICIPANTES E APOIADORES: WEG • BOSCH REXROTH • SELGRON • NEXT • PROVOLT • GELÁSIO";
            const twEmp = fontBold.widthOfTextAtSize(empText, 7.5);
            page.drawText(empText, {
              x: (width - twEmp) / 2,
              y: 53,
              size: 7.5,
              font: fontBold,
              color: cYellow,
            });

            const hash =
              "VR26-" +
              Math.random().toString(36).substring(2, 8).toUpperCase() +
              "-" +
              dados.matricula.slice(-4);
            const dataHoje = new Date().toLocaleDateString("pt-BR");
            const authText = `Certificado expedido em ${dataHoje} | Autenticidade: ${hash}`;
            const twAuth = fontRegular.widthOfTextAtSize(authText, 6.8);
            page.drawText(authText, {
              x: (width - twAuth) / 2,
              y: 40,
              size: 6.8,
              font: fontRegular,
              color: PDFLib.rgb(0.7, 0.75, 0.85),
            });

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Certificado_Valeeu_Robotics_${dados.nome.replace(/\s+/g, "_")}.pdf`;
            document.body.appendChild(link);
            link.click();
            link.remove();

            btnText.innerText = "Certificado Emitido!";
            setTimeout(() => {
              btn.disabled = false;
              spinner.style.display = "none";
              btnText.innerText = "Gerar Certificado Oficial";
            }, 3000);
          } catch (err) {
            alert("Erro ao emitir o certificado: " + err.message);
            btn.disabled = false;
            spinner.style.display = "none";
            btnText.innerText = "Gerar Certificado Oficial";
          }
        });
    </script>
  </body>
</html>
